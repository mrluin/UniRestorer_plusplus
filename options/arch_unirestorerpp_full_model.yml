# Architecture-only example, not a training/evaluation pipeline configuration.
# depth 1 => root full base + two independent complete Restormer experts.
type: UniRestorerPPFullModel
tree_depth: 1
inp_channels: 3
out_channels: 3
dim: 48
num_blocks: [4, 6, 6, 8]
num_refinement_blocks: 4
heads: [1, 2, 4, 8]
ffn_expansion_factor: 2.66
bias: false
LayerNorm_type: BiasFree
dual_pixel_task: false
p: 512
router_hidden_channels: 256
router_feature_channels: 48
router_noise: true
freeze_dr: true
freeze_base: true
frozen_base_eval: true
dr_output_stride: 8
variance_floor: 0.01
variance_init: 1.0
# Optional local native Restormer checkpoint. No automatic download.
# Select an envelope key explicitly, e.g. base_checkpoint_key: params.
base_checkpoint: null
base_checkpoint_key: null
